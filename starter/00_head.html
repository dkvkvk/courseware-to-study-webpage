<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{课程名}} · 学习手册</title>
<style>
:root{
  --text:#2C2C2B; --muted:#6F6C67; --canvas:#FFFFFF; --soft:#F9F8F7; --surface:#F0EFED; --border:#E6E5E3;
  --blue:#2783DE; --blue-soft:#E5F2FC; --green:#46A171; --green-soft:#E8F1EC; --orange:#D5803B; --orange-soft:#FBEBDE; --red:#E56458; --red-soft:#FCE9E7;
  --blue-text:#1F6FBF; --green-text:#2F7A52; --orange-text:#A65A1C; --red-text:#B8392E;
  --s1:#5E9FE8; --s2:#DE9255; --s3:#72BC8F; --s4:#BF8EDA;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Times New Roman","Noto Serif CJK SC",Georgia,serif;
  --mono:Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --text:#FFFFFF; --muted:rgba(255,255,255,.68); --canvas:#191919; --soft:#202020; --surface:#2A2A29; --border:rgba(255,255,255,.18);
    --blue:#5E9FE8; --blue-soft:rgba(94,159,232,.14); --green:#72BC8F; --green-soft:rgba(114,188,143,.13); --orange:#DE9255; --orange-soft:rgba(222,146,85,.14); --red:#E97366; --red-soft:rgba(233,115,102,.14);
    --blue-text:#8DBDF0; --green-text:#93D0AB; --orange-text:#EBB083; --red-text:#F2A198; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--blue-text)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.layout{display:flex;max-width:1180px;margin:0 auto;padding:0 32px;gap:48px}
/* ---------- 目录 ---------- */
#toc{position:sticky;top:0;align-self:flex-start;width:236px;flex:0 0 236px;max-height:100vh;overflow-y:auto;padding:28px 4px 40px 0;font-size:14px;line-height:1.5}
#toc .toc-title{font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.04em;margin:0 0 8px 10px}
#toc ol{list-style:none;margin:0;padding:0}
#toc li{margin:0}
#toc a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px}
#toc a:hover{background:var(--soft);color:var(--text)}
#toc a.active{background:var(--blue-soft);color:var(--blue-text);font-weight:600}
#toc .lvl1>a{color:var(--text);font-weight:600;margin-top:10px}
#toc .lvl2 a{padding-left:22px;font-size:13.5px}
.mobilebar{display:none}
main{flex:1;min-width:0;max-width:820px;padding:28px 0 96px}
/* ---------- 头部 ---------- */
.hero{padding:40px 0 28px;border-bottom:1px solid var(--border);margin-bottom:12px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.06em;margin:0 0 10px}
h1{font-size:36px;line-height:1.25;margin:0 0 12px;font-weight:700;letter-spacing:.01em}
.hero p.lead{font-size:17px;color:var(--muted);margin:0 0 20px;max-width:680px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{font-size:13px;background:var(--soft);border:1px solid var(--border);border-radius:999px;padding:3px 12px;color:var(--muted)}
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 0}
.path a{display:block;text-decoration:none;color:inherit;border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--canvas)}
.path a:hover{background:var(--soft)}
.path .n{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.path .t{font-weight:600;font-size:16px;margin:2px 0 4px}
.path .d{font-size:14px;color:var(--muted);line-height:1.5}
/* ---------- 正文 ---------- */
section.chapter{padding-top:40px}
.chapter-head{border-top:3px solid var(--text);padding-top:16px;margin-bottom:8px}
.chapter-head .num{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.08em}
h2{font-size:28px;line-height:1.3;margin:4px 0 8px}
.chapter-head p{color:var(--muted);margin:0}
section.sec{padding-top:36px}
h3{font-size:22px;line-height:1.35;margin:0 0 12px}
h3 .tag{font-size:12px;font-weight:600;vertical-align:middle;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--muted)}
h4{font-size:17px;margin:28px 0 8px}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:1.4em}
li{margin:3px 0}
strong{font-weight:650}
.muted{color:var(--muted)}
.small{font-size:14px}
hr.sep{border:0;border-top:1px solid var(--border);margin:32px 0}
blockquote{margin:12px 0 16px;padding:12px 16px;border-left:3px solid var(--blue);background:var(--soft);border-radius:0 8px 8px 0}
blockquote p:last-child{margin:0}
.callout{border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:16px 0;background:var(--soft)}
.callout .label{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.callout p:last-child,.callout ul:last-child,.callout ol:last-child{margin-bottom:0}
.callout.key{background:var(--blue-soft);border-color:transparent}.callout.key .label{color:var(--blue-text)}
.callout.warn{background:var(--orange-soft);border-color:transparent}.callout.warn .label{color:var(--orange-text)}
.callout.add{background:var(--green-soft);border-color:transparent}.callout.add .label{color:var(--green-text)}
.callout.err{background:var(--red-soft);border-color:transparent}.callout.err .label{color:var(--red-text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 16px}
.box{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--canvas)}
.box h5{margin:0 0 6px;font-size:15.5px}
.box p,.box ul{font-size:15px;margin-bottom:6px}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.tablewrap{overflow-x:auto;margin:12px 0 16px;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.55}
th,td{padding:9px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--border)}
td:first-child,th:first-child{white-space:nowrap}
td,th{min-width:6em}td.c,th.c,td:first-child,th:first-child{min-width:0}
tr:last-child td{border-bottom:0}
th{background:var(--soft);font-weight:600;font-size:14px;white-space:nowrap}
td.c,th.c{text-align:center}
.steps{counter-reset:st;list-style:none;padding:0;margin:12px 0 16px}
.steps>li{counter-increment:st;position:relative;padding:0 0 10px 40px;margin:0}
.steps>li::before{content:counter(st);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--surface);color:var(--text);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.timeline{list-style:none;padding:0;margin:12px 0 16px;border-left:2px solid var(--border)}
.timeline li{position:relative;padding:0 0 14px 20px;margin:0}
.timeline li::before{content:"";position:absolute;left:-6px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--canvas);border:2px solid var(--blue)}
.timeline .yr{font-weight:700;margin-right:6px}
.layers{display:flex;flex-direction:column;gap:6px;margin:12px 0 16px}
.layer{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:var(--canvas)}
.layer b{font-size:15px}
.layer span{font-size:14.5px;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:12px 0 16px}
.flow .fs{flex:1 1 120px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--canvas);font-size:14px;line-height:1.45}
.flow .fs b{display:block;font-size:14.5px;margin-bottom:2px}
.flow .fs code{font-size:12.5px}
.flow .ar{align-self:center;color:var(--muted);font-size:14px}
code{font-family:var(--mono);font-size:.9em;background:var(--surface);padding:1px 5px;border-radius:4px}
/* ---------- 公式 ---------- */
.m{font-family:var(--serif);font-size:1.08em;white-space:nowrap}
.mb{display:block;font-family:var(--serif);font-size:1.12em;text-align:center;margin:12px 0 16px;padding:10px 8px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;line-height:2.1}
.mb.left{text-align:left}
.m i,.mb i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 .12em}
.frac>.fn{border-bottom:1px solid currentColor;padding:0 .2em .05em}
.frac>.fd{padding:.05em .2em 0}
.frac .frac{font-size:.92em}
.m sup,.mb sup,.m sub,.mb sub{font-size:.68em;line-height:0}
.ss{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1;font-size:.68em}
.ss sup,.ss sub{font-size:1em;line-height:1.1}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em}
.lim-sup,.lim-sub{font-size:.62em;white-space:nowrap}
.bigop{font-size:1.45em;line-height:1}
.int{font-size:1.5em;vertical-align:-.12em;margin-right:.08em}
.sqrt{white-space:nowrap}.sqrt .radicand{border-top:1px solid currentColor;padding:.18em .12em 0;margin-left:.02em}
.rel{margin:0 .3em}.bo{margin:0 .2em}
sup .bo,sub .bo,.lim-sub .bo,.lim-sup .bo,sup .rel,sub .rel,.lim-sub .rel{margin:0 .06em}
.tx{font-family:var(--sans);font-style:normal;font-size:.9em}
.fnm{font-style:normal;margin-right:.18em}
.dl{font-size:1.25em}
/* ---------- 交互组件 ---------- */
.lab{border:1px solid var(--border);border-radius:12px;margin:20px 0 24px;background:var(--canvas);overflow:hidden}
.lab-head{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--soft);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lab-head .badge{font-size:12px;font-weight:700;color:var(--blue-text);background:var(--blue-soft);border-radius:999px;padding:1px 9px}
.lab-head b{font-size:15.5px}
.lab-head .hint{font-size:13.5px;color:var(--muted);flex-basis:100%}
.lab-body{padding:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 20px;margin-bottom:12px}
.ctl label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:2px}
.ctl label output{color:var(--text);font-weight:600;font-family:var(--mono);font-size:13.5px}
input[type=range]{width:100%;accent-color:var(--blue);height:28px;margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--border);background:var(--canvas);color:var(--text);border-radius:8px;padding:7px 14px;min-height:40px;cursor:pointer}
button:hover{background:var(--soft)}
button[aria-pressed=true],button[aria-selected=true]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-text);font-weight:600}
select,input[type=text],input[type=number],input[type=search]{font:inherit;font-size:15px;color:var(--text);background:var(--canvas);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-height:40px;width:100%}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;margin-bottom:12px}
.plotwrap{position:relative;height:260px;margin:4px 0 8px}
.plotwrap.sm{height:200px}
.plotwrap canvas{width:100%;height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;color:var(--muted);margin:4px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important;height:2px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0 4px}
.metric{background:var(--soft);border-radius:8px;padding:8px 12px}
.metric.wide{grid-column:span 2}.metric.wide .v{white-space:nowrap}
@media (max-width:560px){.metric.wide{grid-column:1/-1}}
.metric .k{font-size:12.5px;color:var(--muted)}
.metric .v{font-size:16px;font-weight:650;font-family:var(--mono)}
.verdict{font-size:14.5px;padding:8px 12px;border-radius:8px;margin:8px 0 0}
.verdict.ok{background:var(--green-soft);color:var(--green-text)}
.verdict.bad{background:var(--red-soft);color:var(--red-text)}
.verdict.mid{background:var(--orange-soft);color:var(--orange-text)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}.split>*{min-width:0}
.splane{width:100%;max-width:280px;display:block;margin:0 auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.diagram{overflow-x:auto;margin:8px 0 12px}
.diagram svg{display:block;min-width:620px;width:100%;height:auto}
.diagram.narrow svg{min-width:420px;max-width:560px;margin:0 auto;display:block}
svg text{font-family:var(--sans)}
.out{font-size:15px}
.out .mb{margin:8px 0}
.err-msg{color:var(--red-text);font-size:14px}
/* ---------- 例题 / 折叠 ---------- */
details{border:1px solid var(--border);border-radius:10px;margin:10px 0;background:var(--canvas)}
details>summary{cursor:pointer;padding:11px 16px;font-weight:600;font-size:15.5px;list-style:none;display:flex;gap:10px;align-items:baseline}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";display:inline-block;width:0;height:0;border-left:6px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent;margin-right:2px;transition:transform .15s;flex:none;align-self:center}
details[open]>summary::before{transform:rotate(90deg)}
details>summary .src{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
details .dbody{padding:0 16px 14px;border-top:1px solid var(--border);padding-top:12px;overflow-x:auto}
details .dbody p:last-child{margin-bottom:0}
.q{font-weight:500}
/* ---------- 自测 ---------- */
.quiz{counter-reset:qq}
.qcard{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0;counter-increment:qq}
.qcard .qt::before{content:counter(qq) ". ";font-weight:700}
.qcard .qt{font-weight:550;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opts button{text-align:left;width:100%;justify-content:flex-start}
.opts button.right{background:var(--green-soft);border-color:var(--green);color:var(--green-text);font-weight:600}
.opts button.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red-text)}
.qfb{font-size:14.5px;margin-top:8px;display:none}
.qfb.show{display:block}
.score{position:sticky;bottom:12px;display:inline-block;background:var(--text);color:var(--canvas);font-size:14px;border-radius:999px;padding:6px 14px;margin-top:8px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick .box .mb{font-size:1.02em;margin:6px 0;padding:4px 0}
footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--border);font-size:14px;color:var(--muted)}
footer ul{padding-left:1.2em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
/* ---------- 响应式 ---------- */
@media (max-width:1023px){
  .layout{display:block;padding:0 20px}
  #toc{display:none;position:fixed;inset:56px 0 0 0;width:auto;max-height:none;background:var(--canvas);z-index:20;padding:12px 20px 40px;border-top:1px solid var(--border)}
  #toc.open{display:block}
  .mobilebar{display:flex;position:sticky;top:0;z-index:21;background:var(--canvas);border-bottom:1px solid var(--border);height:56px;align-items:center;justify-content:space-between;padding:0 20px}
  .mobilebar b{font-size:15px}
  main{max-width:none;padding-top:8px}
  html{scroll-padding-top:68px}
}
@media (max-width:640px){
  h1{font-size:28px}
  h2{font-size:24px}
  h3{font-size:20px}
  .path,.grid2,.grid3,.quick{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr)}
  .diagram::after{content:"← 左右滑动查看完整图 →";display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
  .layer{grid-template-columns:1fr;gap:2px}
  .layout{padding:0 16px}
  .lab-body{padding:14px 12px}
  .mb{font-size:.98em;padding:8px 2px}
  table{font-size:14px}
}
.acc{position:relative;display:inline-block}.acc .am{position:absolute;top:-.36em;left:58%;transform:translateX(-50%);font-style:normal;letter-spacing:.01em;line-height:1;font-size:1.05em;font-weight:700}
#ltTable td:last-child{white-space:nowrap;font-size:13px}
table.wide{min-width:700px}
</style>
</head>
